name: CI Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to upload binary assets to, for example v1.0.5
        required: false
        type: string

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        go-version: [1.22.x]
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}

      - name: Download modules
        run: go mod download

      - name: Run unit tests
        run: go test -v ./...

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - goos: linux
            arch: amd64
            ext: ""
          - goos: linux
            arch: arm64
            ext: ""
          - goos: darwin
            arch: amd64
            ext: ""
          - goos: darwin
            arch: arm64
            ext: ""
          - goos: windows
            arch: amd64
            ext: ".exe"
          - goos: windows
            arch: arm64
            ext: ".exe"

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 1.22.x

      - name: Download modules
        run: go mod download

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.arch }}
          BINARY_NAME: run-all-${{ matrix.goos }}-${{ matrix.arch }}${{ matrix.ext }}
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o dist/$BINARY_NAME ./cmd/run-all

      - name: Archive binary
        env:
          ARCHIVE_NAME: run-all-${{ matrix.goos }}-${{ matrix.arch }}
          BINARY_NAME: run-all-${{ matrix.goos }}-${{ matrix.arch }}${{ matrix.ext }}
        run: |
          cd dist
          zip $ARCHIVE_NAME.zip $BINARY_NAME

      - name: Generate and verify SHA256 checksum
        env:
          ARCHIVE_NAME: run-all-${{ matrix.goos }}-${{ matrix.arch }}
        run: |
          cd dist
          shasum -a 256 $ARCHIVE_NAME.zip > $ARCHIVE_NAME.zip.sha256
          shasum -a 256 --check $ARCHIVE_NAME.zip.sha256

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.arch }}
          path: |
            dist/run-all-${{ matrix.goos }}-${{ matrix.arch }}.zip
            dist/run-all-${{ matrix.goos }}-${{ matrix.arch }}.zip.sha256

      - name: Upload release assets
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
          ARCHIVE_NAME: run-all-${{ matrix.goos }}-${{ matrix.arch }}
        run: |
          gh release upload "$RELEASE_TAG" \
            "dist/$ARCHIVE_NAME.zip" \
            "dist/$ARCHIVE_NAME.zip.sha256" \
            --clobber
